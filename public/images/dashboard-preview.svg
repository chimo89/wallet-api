<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img"
     aria-label="Pratinjau dashboard e-wallet: kartu saldo, tombol Top Up, Bayar, Transfer, dan riwayat transaksi">
    <defs>
        <linearGradient id="gHeader" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="45%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#0ea5e9"/>
        </linearGradient>
        <linearGradient id="gCard" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="55%" stop-color="#6d28d9"/>
            <stop offset="100%" stop-color="#0ea5e9"/>
        </linearGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <g font-family="'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif">
        <!-- Jendela aplikasi -->
        <rect width="1280" height="800" fill="#ffffff"/>

        <!-- Title bar browser -->
        <rect width="1280" height="52" fill="#f1f5f9"/>
        <circle cx="28" cy="26" r="6" fill="#f87171"/>
        <circle cx="48" cy="26" r="6" fill="#fbbf24"/>
        <circle cx="68" cy="26" r="6" fill="#34d399"/>
        <rect x="400" y="14" width="480" height="24" rx="12" fill="#e2e8f0"/>
        <text x="640" y="31" text-anchor="middle" font-size="12" fill="#64748b">wallet-api.test/wallet</text>

        <!-- Header aplikasi -->
        <rect y="52" width="1280" height="64" fill="url(#gHeader)"/>
        <rect x="36" y="72" width="24" height="24" rx="8" fill="#ffffff" fill-opacity="0.22"/>
        <text x="48" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">W</text>
        <text x="72" y="90" font-size="19" font-weight="700" fill="#ffffff">WalletAPI</text>
        <text x="1150" y="89" text-anchor="end" font-size="12.5" fill="#ffffff" fill-opacity="0.85">Halo, Budi Santoso</text>
        <rect x="1166" y="70" width="78" height="28" rx="9" fill="#ffffff" fill-opacity="0.2"/>
        <text x="1205" y="89" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Logout</text>

        <!-- Latar isi -->
        <rect y="116" width="1280" height="684" fill="#f8fafc"/>

        <!-- Kartu saldo -->
        <g filter="url(#soft)">
            <rect x="48" y="156" width="560" height="190" rx="20" fill="url(#gCard)"/>
        </g>
        <text x="76" y="200" font-size="14" fill="#e0e7ff">Saldo Saat Ini</text>
        <text x="76" y="254" font-size="42" font-weight="700" fill="#ffffff">Rp 1.250.000</text>
        <text x="76" y="292" font-size="13" fill="#c7d2fe">Nomor HP Anda: 08716478199</text>
        <rect x="466" y="180" width="114" height="34" rx="10" fill="#ffffff" fill-opacity="0.2"/>
        <text x="523" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Perbarui</text>

        <!-- Kartu statistik -->
        <g>
            <rect x="630" y="156" width="190" height="88" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#soft)"/>
            <text x="654" y="188" font-size="12" fill="#94a3b8">Total Top Up</text>
            <text x="654" y="218" font-size="20" font-weight="700" fill="#0f172a">Rp 850.000</text>

            <rect x="840" y="156" width="190" height="88" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#soft)"/>
            <text x="864" y="188" font-size="12" fill="#94a3b8">Total Bayar</text>
            <text x="864" y="218" font-size="20" font-weight="700" fill="#0f172a">Rp 320.000</text>

            <rect x="1050" y="156" width="190" height="88" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#soft)"/>
            <text x="1074" y="188" font-size="12" fill="#94a3b8">Total Transfer</text>
            <text x="1074" y="218" font-size="20" font-weight="700" fill="#0f172a">Rp 180.000</text>
        </g>

        <!-- Tombol aksi -->
        <g>
            <rect x="48" y="378" width="384" height="56" rx="14" fill="#4f46e5" filter="url(#soft)"/>
            <text x="240" y="413" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">+  Top Up</text>

            <rect x="452" y="378" width="384" height="56" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#soft)"/>
            <text x="644" y="413" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Bayar</text>

            <rect x="856" y="378" width="384" height="56" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#soft)"/>
            <text x="1048" y="413" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Transfer</text>
        </g>

        <!-- Kartu riwayat transaksi -->
        <rect x="48" y="466" width="1192" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#soft)"/>
        <text x="76" y="505" font-size="16" font-weight="700" fill="#1e293b">Riwayat Transaksi</text>
        <text x="1212" y="505" text-anchor="end" font-size="12" fill="#94a3b8">Terbaru di atas</text>
        <line x1="76" y1="526" x2="1212" y2="526" stroke="#f1f5f9" stroke-width="1.5"/>

        <!-- Baris 1: Top Up (CREDIT) -->
        <circle cx="100" cy="568" r="18" fill="#d1fae5"/>
        <text x="100" y="574" text-anchor="middle" font-size="19" font-weight="700" fill="#059669">+</text>
        <text x="136" y="562" font-size="14" font-weight="700" fill="#1e293b">Top Up</text>
        <text x="136" y="583" font-size="12" fill="#94a3b8">Top Up Saldo E-Wallet</text>
        <text x="1180" y="568" text-anchor="end" font-size="15" font-weight="700" fill="#059669">+ Rp 100.000</text>
        <text x="1180" y="589" text-anchor="end" font-size="11" fill="#94a3b8">Saldo: Rp 1.250.000</text>
        <line x1="76" y1="608" x2="1212" y2="608" stroke="#f1f5f9" stroke-width="1.5"/>

        <!-- Baris 2: Pembayaran (DEBIT) -->
        <circle cx="100" cy="648" r="18" fill="#ffe4e6"/>
        <text x="100" y="654" text-anchor="middle" font-size="19" font-weight="700" fill="#e11d48">-</text>
        <text x="136" y="642" font-size="14" font-weight="700" fill="#1e293b">Pembayaran</text>
        <text x="136" y="663" font-size="12" fill="#94a3b8">Bayar listrik</text>
        <text x="1180" y="648" text-anchor="end" font-size="15" font-weight="700" fill="#e11d48">- Rp 25.000</text>
        <text x="1180" y="669" text-anchor="end" font-size="11" fill="#94a3b8">Saldo: Rp 1.225.000</text>
        <line x1="76" y1="688" x2="1212" y2="688" stroke="#f1f5f9" stroke-width="1.5"/>

        <!-- Baris 3: Transfer (DEBIT) -->
        <circle cx="100" cy="728" r="18" fill="#ffe4e6"/>
        <text x="100" y="734" text-anchor="middle" font-size="19" font-weight="700" fill="#e11d48">-</text>
        <text x="136" y="722" font-size="14" font-weight="700" fill="#1e293b">Transfer</text>
        <text x="136" y="743" font-size="12" fill="#94a3b8">Bayar utang (To: Siti Aminah)</text>
        <text x="1180" y="728" text-anchor="end" font-size="15" font-weight="700" fill="#e11d48">- Rp 50.000</text>
        <text x="1180" y="749" text-anchor="end" font-size="11" fill="#94a3b8">Saldo: Rp 1.175.000</text>
    </g>
</svg>